name: Deploy Pages

# Publishes the docs/ landing site to GitHub Pages on every change to it.
on:
  push:
    branches: [master]
    paths:
      - docs/**
      - .github/workflows/pages.yml
  release:
    types: [published]   # refresh after a new tagged release
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        # enablement: true turns Pages on for the repo if it isn't already.
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
