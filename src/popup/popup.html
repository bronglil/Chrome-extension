<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapShot Studio</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hdr">
    <span class="hdr__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </span>
    <div class="hdr__text">
      <strong>SnapShot Studio</strong>
      <span>Capture · Record · Sign</span>
    </div>
  </header>

  <div class="scroll">
    <!-- Web page -->
    <section class="grp">
      <h2 class="grp__title">Web page</h2>
      <div class="tiles tiles--3">
        <button class="tile" data-action="capture-visible" title="Grab the visible part of the tab">
          <span class="tile__ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 4"/></svg></span>
          <span>Visible</span>
        </button>
        <button class="tile" data-action="capture-area" title="Draw a rectangle to capture">
          <span class="tile__ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg></span>
          <span>Area</span>
        </button>
        <button class="tile" data-action="capture-full-page" title="Scroll &amp; stitch the whole page">
          <span class="tile__ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/></svg></span>
          <span>Full page</span>
        </button>
      </div>
    </section>

    <!-- Desktop -->
    <section class="grp">
      <h2 class="grp__title">Desktop <span class="grp__hint">picker shown</span></h2>
      <div class="tiles tiles--2">
        <button class="tile" data-action="capture-fullscreen" title="Pick a screen to capture">
          <span class="tile__ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span>
          <span>Full screen</span>
        </button>
        <button class="tile" data-action="capture-window" title="Pick a window to capture">
          <span class="tile__ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg></span>
          <span>Window</span>
        </button>
      </div>
    </section>

    <!-- Timer -->
    <section class="grp">
      <h2 class="grp__title">Delayed shot</h2>
      <div class="chips">
        <button class="chip" data-action="capture-visible" data-delay="3">3s</button>
        <button class="chip" data-action="capture-visible" data-delay="5">5s</button>
        <button class="chip" data-action="capture-visible" data-delay="10">10s</button>
      </div>
    </section>

    <!-- Recording -->
    <section class="grp">
      <h2 class="grp__title">Screen recording</h2>
      <div class="opts">
        <label class="opt"><input type="checkbox" id="rec-mic" /><span>Microphone</span></label>
        <label class="opt"><input type="checkbox" id="rec-audio" checked /><span>Tab / system audio</span></label>
      </div>
      <button class="rec-btn" id="rec-toggle" data-action="toggle-recording">
        <span class="rec-btn__dot" id="rec-ico"></span>
        <span id="rec-label">Start recording</span>
      </button>
      <div class="rec-live" id="rec-status" hidden>
        <span class="rec-live__pulse"></span> Recording <span id="rec-time">00:00</span>
      </div>
    </section>

    <!-- PDF -->
    <section class="grp">
      <h2 class="grp__title">PDF</h2>
      <button class="wide" id="open-pdf" title="Open a PDF to sign or annotate">
        <span class="wide__ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/></svg></span>
        <span>Sign &amp; edit PDF</span>
        <svg class="wide__go" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </section>
  </div>

  <footer class="ftr">
    <button class="ftr__link" id="open-editor">Blank editor</button>
    <span class="ftr__ver">v1.0.0</span>
  </footer>

  <div class="toast" id="toast" hidden></div>
  <script src="popup.js"></script>
</body>
</html>
