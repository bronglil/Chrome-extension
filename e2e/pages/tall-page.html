<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tall Test Page</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body { font-family: sans-serif; }
    /* A fixed header — the full-page routine must hide this after slice 1 so it
       does not duplicate down the stitched image. */
    header {
      position: fixed; top: 0; left: 0; right: 0; height: 60px;
      background: #ef4444; color: #fff; display: flex; align-items: center;
      padding: 0 20px; font-size: 20px; z-index: 1000;
    }
    .band { height: 900px; display: flex; align-items: center; justify-content: center;
      font-size: 64px; color: #fff; }
    #b1 { background: #1e3a8a; } #b2 { background: #15803d; }
    #b3 { background: #a16207; } #b4 { background: #7e22ce; }
    footer { height: 300px; background: #111827; color: #fff; display: flex;
      align-items: center; justify-content: center; font-size: 40px; }
  </style>
</head>
<body>
  <header>FIXED HEADER</header>
  <div class="band" id="b1">SECTION 1</div>
  <div class="band" id="b2">SECTION 2</div>
  <div class="band" id="b3">SECTION 3</div>
  <div class="band" id="b4">SECTION 4</div>
  <footer id="foot">FOOTER END</footer>
</body>
</html>
